version: 2

updates:
  # Android app (root Gradle project). Desktop client is untracked
  # (.gitignore'd), so it has no dependabot manifest to scan here.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Server (Server/requirements.txt)
  - package-ecosystem: pip
    directory: /Server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # The GitHub Actions themselves are a supply-chain dependency too --
  # SHA-pinned actions still need version bumps over time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # NOTE: there's no dependabot ecosystem that tracks a docker image tag
  # referenced via a workflow's `container:` key (semgrep.yml pins
  # semgrep/semgrep:1.175.0 that way) -- the `docker` ecosystem only scans
  # actual Dockerfiles/Kubernetes manifests and errors out otherwise
  # (confirmed live: "No Dockerfiles nor Kubernetes YAML found in
  # /.github/workflows"). That tag needs a manual bump occasionally.
