name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default read-only -- CI/CD hardening per docs/CI_SAST_PLAN.md, Phase 5.
# Neither job here needs to write anything back to the repo.
permissions:
  contents: read

jobs:
  android-build:
    name: Android build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      # JVM unit tests (Robolectric-backed where Android Context is needed --
      # see GroupManagerTest.kt) -- first Kotlin-side security regression
      # tests, covering docs/THREAT_MODEL.md threats B and C (GroupManager
      # authorization, removed-member-loses-group-key invariant).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  server-syntax-check:
    name: Server syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Byte-compile every .py file (syntax check only)
        # compileall doesn't import anything, so this doesn't need
        # requirements.txt installed -- it's a syntax gate, not a runtime
        # test. Won't catch logic/runtime bugs (e.g. the db_connect()
        # infinite-recursion bug found 2026-08-23 -- see docs/ANDROID_AUDIT.md)
        # -- that needs the security regression tests planned separately
        # in docs/CI_SAST_PLAN.md, Phase 4.
        run: python -m compileall -q Server/

      - name: pip-audit (known CVEs in Python deps)
        run: |
          pip install pip-audit
          pip-audit -r Server/requirements.txt

  server-security-tests:
    name: Server security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Server/requirements-dev.txt

      # Concurrency/protocol invariants tied to bugs found in the
      # 2026-08-23 audit (docs/ANDROID_AUDIT.md) -- see
      # docs/CI_SAST_PLAN.md, "Security regression tests".
      - name: Run security regression tests
        run: pytest Server/tests -v
