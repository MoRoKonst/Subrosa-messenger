name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      # Autobuild doesn't know about this project's required JDK 21
      # toolchain -- it defaults to JDK 17, which this Gradle 9.2.1/AGP
      # 9.0.1 setup can't build with (confirmed live: autobuild's own
      # spawned gradlew invocation fails with -Dorg.gradle.java.home
      # pointed at temurin-17). Build explicitly instead, same command as
      # build.yml's android-build job. Python needs no build step at all
      # (interpreted, nothing to compile).
      # Both Kotlin codebases must be built inside the CodeQL tracer: for a
      # compiled language CodeQL only analyses what it observes being compiled,
      # so anything not built here is silently absent from the results. The
      # desktop client is a SEPARATE Gradle build (its own settings.gradle.kts,
      # not included from the root one), so `./gradlew assembleDebug` covers
      # :app only. Until this step was added, ~24.6k lines of desktop client --
      # identity keys, the X3DH/ML-KEM handshake, the whole WebSocket protocol
      # handler -- were outside CodeQL entirely while the workflow still
      # reported "java-kotlin" as analysed.
      - name: Build Android (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build desktop (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x desktop/gradlew
          cd desktop && ./gradlew assemble --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
