# Pins the Gradle daemon itself to Java 21 BY VERSION, not by path.
#
# Kotlin 2.0.21 (the version this module pins) crashes with "Internal compiler
# error" when the Gradle daemon runs on a JDK newer than it knows about -- a
# JDK 25 launcher reproduces it reliably. jvmToolchain(21) in build.gradle.kts
# is not enough on its own: it governs which JDK compiles the code, not which
# one the Kotlin Gradle plugin itself runs under.
#
# This replaces what used to be `org.gradle.java.home=C:\Users\user\...` in
# desktop/gradle.properties: same effect, except Gradle resolves a JDK 21 from
# whatever is installed (or provisions one via the foojay resolver in
# settings.gradle.kts) instead of pointing at one developer's filesystem.
toolchainVersion=21
