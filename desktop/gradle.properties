# NEVER commit org.gradle.java.home here.
#
# This file used to contain exactly one line:
#
#   org.gradle.java.home=C:\\Users\\user\\.gradle\\jdks\\eclipse_adoptium-21-amd64-windows.2
#
# an absolute path to one developer's Windows JDK. It worked on that machine and
# failed instantly everywhere else -- the very first CI run of this module died
# on it with "Java home supplied is invalid", after Gradle itself had downloaded
# fine. Nobody noticed for as long as this module had no CI at all.
#
# JDK selection belongs in the build script, not in a machine-local property:
# build.gradle.kts declares jvmToolchain(21) and settings.gradle.kts applies the
# foojay toolchain resolver, so Gradle locates or provisions a JDK 21 on any
# machine. If you need to pin a specific local JDK, put org.gradle.java.home in
# ~/.gradle/gradle.properties, which lives outside the repository.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.code.style=official
