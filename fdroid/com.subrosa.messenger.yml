MaintainerNotes: |-
  The `foss` product flavour is the one to build. It links no Google code at
  all: no Firebase, no Play Services. Verified upstream by inspecting the
  APK's own dex for `com/google/firebase` and `com/google/android/gms`
  references -- zero in foss, several hundred in the `gms` flavour.

  There is also a `gms` flavour which does link Firebase messaging. It must not
  be built for this repository.

  On `gradleprops: subrosaAllowUnpinnedRelease=true`, which looks like it is
  disabling a security check and is not. Upstream refuses to produce a release
  build with an empty certificate-pin list, specifically so that "pinning
  configured but inert" cannot ship unnoticed. Pinning cannot currently be used
  for that project's own server at all: its TLS is terminated by a CDN whose
  certificate key rotates roughly every 90 days without reuse, so a pin would
  disconnect every installed copy within months. The flag records that accepted
  limitation, upstream's own GitHub releases are built with it, and the whole
  situation is written up in docs/SECURITY.md under "Certificate Pinning".

  On the blocker in the submission report -- "App integrity violated" on
  launch with the CI-built APK. It was real and it is fixed in 1.1.4
  (versionCode 8), the commit pinned above. SignatureValidator compares the
  APK signature against the upstream certificate, and MainActivity acted on
  that in every non-debug build, so an APK signed with any other key -- this
  builder's included -- refused to start. Enforcement is now tied to
  BuildConfig.ENFORCE_SIGNATURE, which the build sets to true only when a
  release keystore and its passwords are present. On these builders there is
  no keystore, so the field compiles to false and the check does not run;
  upstream verified both directions on the tagged commit, in a clean worktree
  with no local.properties, no keystore and no google-services.json.

  Please build 1.1.4 (versionCode 8) rather than 1.1.3: an F-Droid build of
  1.1.3 cannot be launched at all.

  The other point in the report, a Russian interface on an en-US device, is
  fixed in the same version: the language now follows the device locale, and
  a language chosen in the app still takes precedence.

  Still open and not claimed otherwise: the APK carries native WebRTC for four
  ABIs and is about 65 MB. An ABI split changes versionCode arithmetic and this
  recipe, so upstream is doing it as its own change rather than rushing it into
  the release that unblocks this submission.

  Release signing is optional by design: with no keystore and no
  `local.properties` present, `app/build.gradle.kts` installs no signing config
  and the build produces an unsigned APK. Verified in a clean `git worktree`
  with no `local.properties`, no keystore and no `app/google-services.json` --
  the same conditions as these builders.

  `app/google-services.json` is gitignored and the google-services plugin is
  applied only if that file exists, so on a builder without it not even
  Firebase resource strings enter the APK.

  The scanner errors on the first submission attempt were all genuine and are
  fixed in the pinned commit, not worked around: a 33 MB prebuilt tor-android
  AAR that no code referenced has been deleted outright, the foojay toolchain
  resolver is gone from both settings.gradle.kts files, and two unused
  dependency repositories (a JetBrains development channel and jitpack.io) have
  been removed. No scanignore or scandelete is used anywhere.

  On the permissions and the intent filter in the report, each of which is
  deliberate and is now documented upstream in docs/PERMISSIONS.md:

  The accessibility service is the emergency wipe trigger -- it catches a
  volume-down key sequence, and that is the only reason an accessibility
  service is used. Its onAccessibilityEvent() is an empty method, so it reads
  no screen content from any app. Upstream narrowed the service config from
  accessibilityEventTypes="typeAllMask" to a single event type in the commit
  pinned here, after this report; canRequestFilterKeyEvents and
  packageNames="com.subrosa.messenger" were already set, and the wipe is off
  until the user enables it.

  QUERY_ALL_PACKAGES serves one feature: a check that warns the user about
  other installed apps holding an accessibility service, device-admin rights
  or a granted overlay permission. Without it Android 11+ returns a filtered
  list and the check becomes quietly useless. Nothing derived from it leaves
  the device. Orbot, the only package looked up by name, now has its own
  <queries> element so it does not rely on this permission.

  Location is requested at the moment the user taps "share location" in a
  chat; there is no background location permission. WRITE_EXTERNAL_STORAGE is
  capped at maxSdkVersion=32 and is only for saving a received photo on older
  Android. CAMERA, RECORD_AUDIO, FOREGROUND_SERVICE_CAMERA and INTERNET are
  calls, media and the message connection.

  Two permissions that were declared and used by nothing, DISABLE_KEYGUARD and
  MANAGE_OWN_CALLS, were removed in the same pass rather than explained.

  Upstream is explicit that the project has had no external security audit and
  that its cryptographic composition is its own work; see the limits section of
  the full description and docs/KNOWN_SECURITY_ISSUES.md.

