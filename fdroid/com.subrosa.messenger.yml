MaintainerNotes: |-
  The `foss` product flavour is the one to build. It links no Google code at
  all: no Firebase, no Play Services. Verified upstream by inspecting the
  APK's own dex for `com/google/firebase` and `com/google/android/gms`
  references -- zero in foss, several hundred in the `gms` flavour.

  There is also a `gms` flavour which does link Firebase messaging. It must not
  be built for this repository.

  On `gradleprops: subrosaAllowUnpinnedRelease=true`, which looks like it is
  disabling a security check and is not. Upstream refuses to produce a release
  build with an empty certificate-pin list, specifically so that "pinning
  configured but inert" cannot ship unnoticed. Pinning cannot currently be used
  for that project's own server at all: its TLS is terminated by a CDN whose
  certificate key rotates roughly every 90 days without reuse, so a pin would
  disconnect every installed copy within months. The flag records that accepted
  limitation, upstream's own GitHub releases are built with it, and the whole
  situation is written up in docs/SECURITY.md under "Certificate Pinning".

  Release signing is optional by design: with no keystore and no
  `local.properties` present, `app/build.gradle.kts` installs no signing config
  and the build produces an unsigned APK. Verified in a clean `git worktree`
  with no `local.properties`, no keystore and no `app/google-services.json` --
  the same conditions as these builders.

  `app/google-services.json` is gitignored and the google-services plugin is
  applied only if that file exists, so on a builder without it not even
  Firebase resource strings enter the APK.

  The scanner errors on the first submission attempt were all genuine and are
  fixed in the pinned commit, not worked around: a 33 MB prebuilt tor-android
  AAR that no code referenced has been deleted outright, the foojay toolchain
  resolver is gone from both settings.gradle.kts files, and two unused
  dependency repositories (a JetBrains development channel and jitpack.io) have
  been removed. No scanignore or scandelete is used anywhere.

  Upstream is explicit that the project has had no external security audit and
  that its cryptographic composition is its own work; see the limits section of
  the full description and docs/KNOWN_SECURITY_ISSUES.md.

