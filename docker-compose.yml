version: '3.8'

services:
  beacon-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beacon-messenger-server
    ports:
      - "9000:9000"
    environment:
      BEACON_HOST: "0.0.0.0"
      BEACON_PORT: 9000
    volumes:
      - beacon-data:/app/data
    restart: unless-stopped
    networks:
      - beacon-network
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; asyncio.run(asyncio.sleep(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: beacon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - beacon-server
    restart: unless-stopped
    networks:
      - beacon-network

volumes:
  beacon-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  beacon-network:
    driver: bridge
