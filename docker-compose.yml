version: '3.8'

services:
  subrosa-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subrosa-messenger-server
    ports:
      - "9000:9000"
    environment:
      SUBROSA_HOST: "0.0.0.0"
      SUBROSA_PORT: 9000
    volumes:
      - subrosa-data:/app/data
    restart: unless-stopped
    networks:
      - subrosa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; asyncio.run(asyncio.sleep(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: subrosa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - subrosa-server
    restart: unless-stopped
    networks:
      - subrosa-network

volumes:
  subrosa-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  subrosa-network:
    driver: bridge
