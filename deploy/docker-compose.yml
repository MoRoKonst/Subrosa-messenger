version: '3.8'

services:
  subrosa-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: subrosa-messenger-server
    # Loopback only. nginx reaches the server over the compose network
    # (upstream subrosa-server:9000), so nothing needs this port published
    # externally -- and the server runs with --dev, i.e. no TLS of its own.
    # Publishing it on all interfaces put the plaintext protocol straight on
    # the public internet, which is KL-25 ("server port 9000 directly
    # reachable", Critical) reintroduced through the deployment everyone is
    # told to use. The host binding is kept for local debugging.
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - ../.env
    environment:
      # SUBROSA_BIND_HOST/SUBROSA_BIND_PORT, not SUBROSA_HOST/SUBROSA_PORT:
      # those were the names here (and in .env.example) for a long time, and
      # server.py has never read them -- it reads SUBROSA_BIND_HOST and
      # SUBROSA_BIND_PORT. Nothing visibly broke only because the values set
      # here happened to match the code's own defaults. Anyone who edited them
      # to move the bind address got silence.
      SUBROSA_BIND_HOST: "0.0.0.0"
      SUBROSA_BIND_PORT: 9000
      # Without this, DB_PATH defaults to the relative "messages.db", which
      # resolves against WORKDIR /app -- outside the subrosa-data volume
      # mounted below at /app/data. The DB would live in the container's
      # writable layer and be lost on every recreate. Found live.
      DB_PATH: /app/data/messages.db
    volumes:
      - subrosa-data:/app/data
    restart: unless-stopped
    networks:
      - subrosa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; asyncio.run(asyncio.sleep(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: subrosa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - subrosa-server
    restart: unless-stopped
    networks:
      - subrosa-network

volumes:
  subrosa-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  subrosa-network:
    driver: bridge
